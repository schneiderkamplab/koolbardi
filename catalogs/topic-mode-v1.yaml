modes:
  - {id: direct_question, en: answer a focused question, da: besvar et afgrænset spørgsmål}
  - {id: explanation, en: explain a concept with useful context, da: forklar et begreb med relevant kontekst}
  - {id: tutoring, en: teach interactively and check understanding, da: undervis interaktivt og afklar forståelsen}
  - {id: planning, en: develop a practical plan, da: udarbejd en praktisk plan}
  - {id: troubleshooting, en: diagnose and resolve a problem, da: diagnosticér og løs et problem}
  - {id: comparison, en: compare alternatives using explicit criteria, da: sammenlign alternativer efter tydelige kriterier}
  - {id: recommendation, en: recommend under realistic constraints, da: giv en anbefaling under realistiske begrænsninger}
  - {id: judgement, en: make and justify a considered judgement, da: foretag og begrund en velovervejet vurdering}
  - {id: development, en: develop an initial idea into a concrete result, da: udvikl en foreløbig idé til et konkret resultat}
  - {id: brainstorming, en: generate and organize varied ideas, da: generér og organisér varierede idéer}
  - {id: calculation, en: solve a quantitative problem and explain the method, da: løs et kvantitativt problem og forklar metoden}
  - {id: critique, en: critique supplied material constructively, da: kritisér det vedlagte materiale konstruktivt, embedded_input: true}
  - {id: revision, en: revise supplied material to stated requirements, da: revidér det vedlagte materiale efter angivne krav, embedded_input: true}
  - {id: summarization, en: summarize supplied material to a specified scope, da: sammenfat det vedlagte materiale i et angivet omfang, embedded_input: true}
  - {id: transformation, en: transform supplied material while preserving meaning, da: transformér det vedlagte materiale uden at ændre betydningen, embedded_input: true}
  - {id: extraction, en: extract structured information from supplied material, da: udtræk struktureret information fra det vedlagte materiale, embedded_input: true}
  - {id: classification, en: classify supplied examples using clear criteria, da: klassificér de vedlagte eksempler efter klare kriterier, embedded_input: true}
  - {id: verification, en: verify claims or work shown in supplied material, da: kontrollér påstande eller udregninger i det vedlagte materiale, embedded_input: true}
  - {id: evaluation, en: evaluate supplied work against a rubric, da: evaluér det vedlagte arbejde efter en rubric, embedded_input: true}
  - {id: decision_support, en: structure a decision with tradeoffs and uncertainty, da: strukturér en beslutning med afvejninger og usikkerhed}
